---
name: Multiple Skyline Transactions

on:
  schedule:
    - cron: "0 6,11 * * *" # currently run at ~10:00 and ~15:00
      timezone: "Europe/Belgrade"
  workflow_dispatch:
    inputs:
      notification:
        type: boolean
        required: false
        description: "Notification"
        default: true

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  source_prime:
    name: Source Prime
    uses: ./.github/workflows/source-prime.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  source_preview:
    name: Source Preview
    uses: ./.github/workflows/source-preview.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  source_vector:
    name: Source Vector
    uses: ./.github/workflows/source-vector.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  source_nexus:
    name: Source Nexus
    uses: ./.github/workflows/source-nexus.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  source_polygon:
    name: Source Polygon
    uses: ./.github/workflows/source-polygon.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  source_ethereum:
    name: Source Ethereum
    uses: ./.github/workflows/source-ethereum.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  source_katana:
    name: Source Katana
    uses: ./.github/workflows/source-katana.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  source_sei:
    name: Source Sei
    uses: ./.github/workflows/source-sei.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  # source_scroll:
  #   name: Source Scroll
  #   uses: ./.github/workflows/source-scroll.yml
  #   with:
  #     bridge_name: Skyline
  #   secrets: inherit

  source_unichain:
    name: Source Unichain
    uses: ./.github/workflows/source-unichain.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  source_solana:
    name: Source Solana
    uses: ./.github/workflows/source-solana.yml
    with:
      bridge_name: Skyline
    secrets: inherit

  notification:
    name: Notification
    if: (!cancelled() && (github.event_name == 'schedule' || inputs.notification != false))
    uses: ./.github/workflows/notification-summary.yml
    needs:
      - source_prime
      - source_preview
      - source_vector
      - source_nexus
      - source_polygon
      - source_ethereum
      - source_katana
      - source_sei
      # - source_scroll
      - source_unichain
      - source_solana
    with:
      needs_json: ${{ toJSON(needs) }}
      bridge_name: Skyline
    secrets: inherit
