---
name: Multiple Skyline Partner Transactions
on:
  schedule:
    - cron: '0 6,13 * * *'
  workflow_dispatch:
    inputs:
      notification:
        required: false
        description: Notification
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  prime_ap3x_to_preview_cap3x:
    name: Prime(AP3X) to Preview(cAP3X)
    uses: ./.github/workflows/single-transaction.yml
    with:
      bridge: Skyline
      deployment: Partner
      source_chain: Prime
      source_token: AP3X
      destination_chain: Preview
      destination_token: cAP3X
      amount: 5
      eternl_wallet_extension: Stable
      notification: false
    secrets:
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      PRIME_WALLET_RECOVERY_PHRASE: ${{ secrets.PRIME_WALLET_RECOVERY_PHRASE }}
      PREVIEW_WALLET_RECOVERY_PHRASE: ${{ secrets.PREVIEW_WALLET_RECOVERY_PHRASE }}
  # prime_wada_to_preview_ada:
  #   name: Prime(WAda) to Preview(Ada)
  #   uses: ./.github/workflows/single-transaction.yml
  #   needs: prime_ap3x_to_preview_cap3x
  #   if: success() || failure()
  #   with:
  #     bridge: Skyline
  #     deployment: Partner
  #     source_chain: Prime
  #     source_token: WADA
  #     destination_chain: Preview
  #     destination_token: ADA
  #     amount: 5
  #     eternl_wallet_extension: Stable
  #     notification: false
  #   secrets:
  #     SIGN_KEY: ${{ secrets.SIGN_KEY }}
  #     PRIME_WALLET_RECOVERY_PHRASE: ${{ secrets.PRIME_WALLET_RECOVERY_PHRASE }}
  #     PREVIEW_WALLET_RECOVERY_PHRASE: ${{ secrets.PREVIEW_WALLET_RECOVERY_PHRASE }}
  # preview_ada_to_prime_wada:
  #   name: Preview(ADA) to Prime(WAda)
  #   uses: ./.github/workflows/single-transaction.yml
  #   with:
  #     bridge: Skyline
  #     deployment: Partner
  #     source_chain: Preview
  #     source_token: Ada
  #     destination_chain: Prime
  #     destination_token: WAda
  #     amount: 2
  #     eternl_wallet_extension: Stable
  #     notification: false
  #   secrets:
  #     SIGN_KEY: ${{ secrets.SIGN_KEY }}
  #     PREVIEW_WALLET_RECOVERY_PHRASE: ${{ secrets.PREVIEW_WALLET_RECOVERY_PHRASE }}
  #     PRIME_WALLET_RECOVERY_PHRASE: ${{ secrets.PRIME_WALLET_RECOVERY_PHRASE }}
  preview_cap3x_to_prime_ap3x:
    name: Preview(cAP3X) to Prime(AP3X)
    uses: ./.github/workflows/single-transaction.yml
    # needs: preview_ada_to_prime_wada
    with:
      bridge: Skyline
      deployment: Partner
      source_chain: Preview
      source_token: cAP3X
      destination_chain: Prime
      destination_token: AP3X
      amount: 2
      eternl_wallet_extension: Stable
      notification: false
    secrets:
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      PREVIEW_WALLET_RECOVERY_PHRASE: ${{ secrets.PREVIEW_WALLET_RECOVERY_PHRASE }}
      PRIME_WALLET_RECOVERY_PHRASE: ${{ secrets.PRIME_WALLET_RECOVERY_PHRASE }}
  inputs_check:
    name: Inputs Check
    runs-on: ubuntu-latest
    outputs:
      notification: ${{ steps.notification_input_check.outputs.notification }}
    steps:
      - name: Notification Input Check
        id: notification_input_check
        run: |
          if [[ "${{ inputs.notification }}" != "false" ]]; then
            echo "notification=true" >> $GITHUB_OUTPUT
          else
            echo "notification=false" >> $GITHUB_OUTPUT
          fi
  notification:
    name: Send notification
    uses: ./.github/workflows/multiple-transactions-notification.yml
    # needs: [prime_ap3x_to_preview_cap3x, prime_wada_to_preview_ada, preview_ada_to_prime_wada, preview_cap3x_to_prime_ap3x, inputs_check]
    needs: [prime_ap3x_to_preview_cap3x, preview_cap3x_to_prime_ap3x, inputs_check]
    if: ((success() || failure()) && (needs.inputs_check.outputs.notification == 'true'))
    with:
      bridge: Skyline
      deployment: Partner
      eternl_wallet_extension: Stable
      tx_01_source_chain: Prime
      tx_01_source_token: APEX
      tx_01_destination_chain: Preview
      tx_01_destination_token: WAPEX
      tx_01_source_status: ${{ needs.prime_ap3x_to_preview_cap3x.outputs.source_status }}
      tx_01_bridge_status: ${{ needs.prime_ap3x_to_preview_cap3x.outputs.bridge_status }}
      tx_01_destination_status: ${{ needs.prime_ap3x_to_preview_cap3x.outputs.destination_status }}
      tx_01_status: ${{ needs.prime_ap3x_to_preview_cap3x.outputs.bridging_status }}
      tx_02_source_chain: Prime
      tx_02_source_token: WAda
      tx_02_destination_chain: Preview
      tx_02_destination_token: Ada
      # tx_02_source_status: ${{ needs.prime_wada_to_preview_ada.outputs.source_status }}
      # tx_02_bridge_status: ${{ needs.prime_wada_to_preview_ada.outputs.bridge_status }}
      # tx_02_destination_status: ${{ needs.prime_wada_to_preview_ada.outputs.destination_status }}
      # tx_02_status: ${{ needs.prime_wada_to_preview_ada.outputs.bridging_status }}
      # tx_03_source_chain: Preview
      # tx_03_source_token: Ada
      # tx_03_destination_chain: Prime
      # tx_03_destination_token: WAda
      # tx_03_source_status: ${{ needs.preview_ada_to_prime_wada.outputs.source_status }}
      # tx_03_bridge_status: ${{ needs.preview_ada_to_prime_wada.outputs.bridge_status }}
      # tx_03_destination_status: ${{ needs.preview_ada_to_prime_wada.outputs.destination_status }}
      # tx_03_status: ${{ needs.preview_ada_to_prime_wada.outputs.bridging_status }}
      tx_02_source_status: "true"
      tx_02_bridge_status: "true"
      tx_02_destination_status: "true"
      tx_02_status: "success"
      tx_03_source_chain: Preview
      tx_03_source_token: Ada
      tx_03_destination_chain: Prime
      tx_03_destination_token: WAda
      tx_03_source_status: "true"
      tx_03_bridge_status: "true"
      tx_03_destination_status: "true"
      tx_03_status: "success"
      tx_04_source_chain: Preview
      tx_04_source_token: WAPEX
      tx_04_destination_chain: Prime
      tx_04_destination_token: APEX
      tx_04_source_status: ${{ needs.preview_cap3x_to_prime_ap3x.outputs.source_status }}
      tx_04_bridge_status: ${{ needs.preview_cap3x_to_prime_ap3x.outputs.bridge_status }}
      tx_04_destination_status: ${{ needs.preview_cap3x_to_prime_ap3x.outputs.destination_status }}
      tx_04_status: ${{ needs.preview_cap3x_to_prime_ap3x.outputs.bridging_status }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
