---
name: Source Ethereum Transactions

on:
  workflow_call:
    inputs:
      bridge_name:
        type: string
        required: true

    outputs:
      transactions:
        value: ${{ jobs.collect.outputs.transactions }}

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  ethereum_eth_to_preview_ceth:
    name: Ethereum(ETH) to Preview(cETH)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Ethereum
      amount: 0.0005
      source_token: ETH
      destination_chain: Preview
      destination_token: cETH
      notification: false
    secrets: inherit

  collect:
    name: Collect
    uses: ./.github/workflows/collect-transactions.yml
    if: (!cancelled())
    needs:
      - ethereum_eth_to_preview_ceth
    with:
      needs_json: ${{ toJSON(needs) }}
      source_chain: Ethereum
