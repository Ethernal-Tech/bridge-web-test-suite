---
name: Source Vector Transactions

on:
  workflow_call:
    inputs:
      bridge_name:
        type: string
        required: true
      notification:
        type: boolean
        required: true

    outputs:
      transactions:
        value: ${{ jobs.notification.outputs.transactions }}

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  vector_ap3x_to_prime_ap3x:
    name: Vector(AP3X) to Prime(AP3X)
    uses: ./.github/workflows/single-transaction.yml
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: AP3X
      destination_chain: Prime
      destination_token: AP3X
      notification: false
    secrets: inherit

  vector_ap3x_to_nexus_ap3x:
    name: Vector(AP3X) to Nexus(AP3X)
    uses: ./.github/workflows/single-transaction.yml
    needs: vector_ap3x_to_prime_ap3x
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: AP3X
      destination_chain: Nexus
      destination_token: AP3X
      notification: false
    secrets: inherit

  vector_xada_to_preview_ada:
    name: Vector(xADA) to Preview(ADA)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_ap3x_to_nexus_ap3x
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 5
      source_token: xADA
      destination_chain: Preview
      destination_token: ADA
      notification: false
    secrets: inherit

  vector_xada_to_nexus_xada:
    name: Vector(xADA) to Nexus(xADA)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_xada_to_preview_ada
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 5
      source_token: xADA
      destination_chain: Nexus
      destination_token: xADA
      notification: false
    secrets: inherit

  vector_mytesttoken_to_nexus_mytesttoken:
    name: Vector(myTestToken) to Nexus(myTestToken)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_xada_to_nexus_xada
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: myTestToken
      destination_chain: Nexus
      destination_token: myTestToken
      notification: false
    secrets: inherit

  vector_tokn2_to_nexus_tokn2:
    name: Vector(TokN2) to Nexus(TokN2)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_mytesttoken_to_nexus_mytesttoken
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: TokN2
      destination_chain: Nexus
      destination_token: TokN2
      notification: false
    secrets: inherit

  vector_tokn3_to_nexus_tokn3:
    name: Vector(TokN3) to Nexus(TokN3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_tokn2_to_nexus_tokn2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: TokN3
      destination_chain: Nexus
      destination_token: TokN3
      notification: false
    secrets: inherit

  vector_tokc1_to_nexus_tokc1:
    name: Vector(TokC1) to Nexus(TokC1)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_tokn3_to_nexus_tokn3
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: TokC1
      destination_chain: Nexus
      destination_token: TokC1
      notification: false
    secrets: inherit

  vector_tokc2_to_nexus_tokc2:
    name: Vector(TokC2) to Nexus(TokC2)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_tokc1_to_nexus_tokc1
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: TokC2
      destination_chain: Nexus
      destination_token: TokC2
      notification: false
    secrets: inherit

  vector_tokc3_to_nexus_tokc3:
    name: Vector(TokC3) to Nexus(TokC3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_tokc2_to_nexus_tokc2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: TokC3
      destination_chain: Nexus
      destination_token: TokC3
      notification: false
    secrets: inherit

  vector_tokv1_to_nexus_tokv1:
    name: Vector(TokV1) to Nexus(TokV1)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_tokc3_to_nexus_tokc3
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: TokV1
      destination_chain: Nexus
      destination_token: TokV1
      notification: false
    secrets: inherit

  vector_tokv2_to_nexus_tokv2:
    name: Vector(TokV2) to Nexus(TokV2)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_tokv1_to_nexus_tokv1
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: TokV2
      destination_chain: Nexus
      destination_token: TokV2
      notification: false
    secrets: inherit

  vector_tokv3_to_nexus_tokv3:
    name: Vector(TokV3) to Nexus(TokV3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_tokv2_to_nexus_tokv2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: TokV3
      destination_chain: Nexus
      destination_token: TokV3
      notification: false
    secrets: inherit

  vector_ap3x_to_solana_ap3x:
    name: Vector(AP3X) to Solana(AP3X)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_tokv3_to_nexus_tokv3
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: AP3X
      destination_chain: Solana
      destination_token: AP3X
      notification: false
    secrets: inherit

  vector_asol_to_solana_asol:
    name: Vector(aSOL) to Solana(aSOL)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: vector_ap3x_to_solana_ap3x
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Vector
      amount: 2
      source_token: aSOL
      destination_chain: Solana
      destination_token: aSOL
      notification: false
    secrets: inherit

  notification:
    name: Notification
    uses: ./.github/workflows/notification.yml
    if: (!cancelled() && inputs.notification)
    needs:
      - vector_ap3x_to_prime_ap3x
      - vector_ap3x_to_nexus_ap3x
      - vector_xada_to_preview_ada
      - vector_xada_to_nexus_xada
      - vector_mytesttoken_to_nexus_mytesttoken
      - vector_tokn2_to_nexus_tokn2
      - vector_tokn3_to_nexus_tokn3
      - vector_tokc1_to_nexus_tokc1
      - vector_tokc2_to_nexus_tokc2
      - vector_tokc3_to_nexus_tokc3
      - vector_tokv1_to_nexus_tokv1
      - vector_tokv2_to_nexus_tokv2
      - vector_tokv3_to_nexus_tokv3
      - vector_ap3x_to_solana_ap3x
      - vector_asol_to_solana_asol
    with:
      needs_json: ${{ toJSON(needs) }}
      bridge_name: ${{ inputs.bridge_name }}
    secrets: inherit
