---
name: Single Notification
on:
  workflow_call:
    inputs:
      bridge:
        type: string
        required: true
      source_chain:
        type: string
        required: true
      source_token:
        type: string
        required: true
      destination_chain:
        type: string
        required: true
      destination_token:
        type: string
        required: true
      bridging_status:
        type: string
        required: true

    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notification:
    name: Notification
    runs-on: ubuntu-latest
    steps:
      - name: Short SHA
        id: short_sha
        run: echo "value=`echo ${{ github.sha }} | cut -c1-7`" >> $GITHUB_OUTPUT
      - name: Notify Slack
        uses: slackapi/slack-github-action@v3.0.3
        env:
          succeed_bnt: 'primary'
          failed_bnt: 'danger'
          succeed_job: ':green:'
          failed_job: ':red:'
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ inputs.bridge }} Test"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Workflow Run"
                      },
                      "style": "${{ inputs.bridging_status == 'success' && env.succeed_bnt || env.failed_bnt }}",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Logs"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ fromJSON(inputs.bridging_status).logs_artifact_id }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Commit: *<https://github.com/${{ github.repository }}/tree/${{ github.sha }}|${{ steps.short_sha.outputs.value }}>*"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ fromJSON(inputs.bridging_status).source == 'true' && env.succeed_job || env.failed_job }} *${{ inputs.source_chain }} ${{ inputs.source_token }}* ${{ fromJSON(inputs.bridging_status).bridge == 'true' && env.succeed_job || env.failed_job }} *Bridge* ${{ fromJSON(inputs.bridging_status).destination == 'true' && env.succeed_job || env.failed_job }} *${{ inputs.destination_chain }} ${{ inputs.destination_token }}*"
                  }
                }
              ]
            }
