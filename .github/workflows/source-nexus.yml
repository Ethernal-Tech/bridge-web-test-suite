      destination_chain: Vector
      destination_token: xPOL
      notification: false
    secrets: inherit

  notification:
    name: Notification
    uses: ./.github/workflows/notification.yml
    if: (!cancelled() && inputs.notification)
    needs:
      - nexus_ap3x_to_prime_ap3x
      - nexus_ap3x_to_vector_ap3x
      - nexus_xada_to_preview_ada
      - nexus_mytesttoken_to_preview_mytesttoken
      - nexus_tokn2_to_preview_tokn2
      - nexus_tokn3_to_preview_tokn3
      - nexus_tokc1_to_preview_tokc1
      - nexus_tokc2_to_preview_tokc2
      - nexus_tokc3_to_preview_tokc3
      - nexus_tokv1_to_preview_tokv1
      - nexus_tokv2_to_preview_tokv2
      - nexus_tokv3_to_preview_tokv3
      - nexus_xada_to_vector_xada
      - nexus_mytesttoken_to_vector_mytesttoken
      - nexus_tokn2_to_vector_tokn2
      - nexus_tokn3_to_vector_tokn3
      - nexus_tokc1_to_vector_tokc1
      - nexus_tokc2_to_vector_tokc2
      - nexus_tokc3_to_vector_tokc3
      - nexus_tokv1_to_vector_tokv1
      - nexus_tokv2_to_vector_tokv2
      - nexus_tokv3_to_vector_tokv3
      - nexus_ap3x_to_polygon_xpol
      - nexus_xpol_to_polygon_xpol
    with:
      needs_json: ${{ toJSON(needs) }}
      bridge_name: ${{ inputs.bridge_name }}
