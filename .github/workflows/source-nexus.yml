    secrets: inherit

  nexus_tokc1_to_vector_tokc1:
    name: Nexus(TokC1) to Vector(TokC1)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
