  nexus_tokn3_to_vector_tokn3:
    name: Nexus(TokN3) to Vector(TokN3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokn2_to_vector_tokn2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: TokN3
      destination_chain: Vector
      destination_token: TokN3
