      destination_token: TokC1
      notification: false
    secrets: inherit

  nexus_tokc2_to_vector_tokc2:
    name: Nexus(TokC2) to Vector(TokC2)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokc1_to_vector_tokc1
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: TokC2
      destination_chain: Vector
      destination_token: TokC2
      notification: false
    secrets: inherit

  nexus_tokc3_to_vector_tokc3:
    name: Nexus(TokC3) to Vector(TokC3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokc2_to_vector_tokc2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: TokC3
      destination_chain: Vector
      destination_token: TokC3
      notification: false
    secrets: inherit

  nexus_tokv1_to_vector_tokv1:
    name: Nexus(TokV1) to Vector(TokV1)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokc3_to_vector_tokc3
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: TokV1
      destination_chain: Vector
      destination_token: TokV1
      notification: false
    secrets: inherit

  nexus_tokv2_to_vector_tokv2:
