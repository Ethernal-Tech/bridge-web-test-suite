      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: TokC2
      destination_chain: Preview
      destination_token: TokC2
      notification: false
    secrets: inherit

  nexus_tokc3_to_preview_tokc3:
    name: Nexus(TokC3) to Preview(TokC3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokc2_to_preview_tokc2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: TokC3
      destination_chain: Preview
      destination_token: TokC3
      notification: false
    secrets: inherit

  nexus_tokv1_to_preview_tokv1:
    name: Nexus(TokV1) to Preview(TokV1)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokc3_to_preview_tokc3
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: TokV1
      destination_chain: Preview
      destination_token: TokV1
      notification: false
    secrets: inherit

  nexus_tokv2_to_preview_tokv2:
    name: Nexus(TokV2) to Preview(TokV2)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokv1_to_preview_tokv1
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: TokV2
      destination_chain: Preview
      destination_token: TokV2
      notification: false
    secrets: inherit

  nexus_tokv3_to_preview_tokv3:
    name: Nexus(TokV3) to Preview(TokV3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokv2_to_preview_tokv2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: TokV3
      destination_chain: Preview
      destination_token: TokV3
      notification: false
    secrets: inherit

  nexus_xada_to_vector_xada:
    name: Nexus(xADA) to Vector(xADA)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokv3_to_preview_tokv3
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: xADA
      destination_chain: Vector
      destination_token: xADA
      notification: false
    secrets: inherit

  nexus_mytesttoken_to_vector_mytesttoken:
    name: Nexus(myTestToken) to Vector(myTestToken)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_xada_to_vector_xada
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: myTestToken
      destination_chain: Vector
      destination_token: myTestToken
      notification: false
    secrets: inherit

  nexus_tokn2_to_vector_tokn2:
    name: Nexus(TokN2) to Vector(TokN2)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_mytesttoken_to_vector_mytesttoken
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: TokN2
