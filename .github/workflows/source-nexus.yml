---
name: Source Nexus Transactions

on:
  workflow_call:
    inputs:
      bridge_name:
        type: string
        required: true
      notification:
        type: boolean
        required: true

    outputs:
      transactions:
        value: ${{ jobs.notification.outputs.transactions }}

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  nexus_ap3x_to_prime_ap3x:
    name: Nexus(AP3X) to Prime(AP3X)
    uses: ./.github/workflows/single-transaction.yml
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: AP3X
      destination_chain: Prime
      destination_token: AP3X
      notification: false
    secrets: inherit
  
  nexus_ap3x_to_vector_ap3x:
    name: Nexus(AP3X) to Vector(AP3X)
    uses: ./.github/workflows/single-transaction.yml
    needs: nexus_ap3x_to_prime_ap3x
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: AP3X
      destination_chain: Vector
      destination_token: AP3X
      notification: false
    secrets: inherit

  nexus_xada_to_preview_ada:
    name: Nexus(xADA) to Preview(ADA)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_ap3x_to_vector_ap3x
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: xADA
      destination_chain: Preview
      destination_token: ADA
      notification: false
    secrets: inherit

  nexus_mytesttoken_to_preview_mytesttoken:
    name: Nexus(myTestToken) to Preview(myTestToken)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_xada_to_preview_ada
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: myTestToken
      destination_chain: Preview
      destination_token: myTestToken
      notification: false
    secrets: inherit

  nexus_tokn2_to_preview_tokn2:
    name: Nexus(TokN2) to Preview(TokN2)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_mytesttoken_to_preview_mytesttoken
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: TokN2
      destination_chain: Preview
      destination_token: TokN2
      notification: false
    secrets: inherit

  nexus_tokn3_to_preview_tokn3:
    name: Nexus(TokN3) to Preview(TokN3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokn2_to_preview_tokn2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: TokN3
      destination_chain: Preview
      destination_token: TokN3
      notification: false
    secrets: inherit

  nexus_tokc1_to_preview_tokc1:
    name: Nexus(TokC1) to Preview(TokC1)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokn3_to_preview_tokn3
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 2
      source_token: TokC1
