    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokv1_to_vector_tokv1
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: TokV2
      destination_chain: Vector
      destination_token: TokV2
      notification: false
    secrets: inherit

  nexus_tokv3_to_vector_tokv3:
    name: Nexus(TokV3) to Vector(TokV3)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokv2_to_vector_tokv2
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: TokV3
      destination_chain: Vector
      destination_token: TokV3
      notification: false
    secrets: inherit

  nexus_ap3x_to_polygon_xpol:
    name: Nexus(AP3X) to Vector(xPOL)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_tokv3_to_vector_tokv3
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Nexus
      amount: 5
      source_token: AP3X
      destination_chain: Vector
      destination_token: xPOL
      notification: false
    secrets: inherit

  nexus_xpol_to_polygon_xpol:
    name: Nexus(xPOL) to Vector(xPOL)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    needs: nexus_ap3x_to_polygon_xpol
    with:
      bridge_name: ${{ inputs.bridge_name }}
