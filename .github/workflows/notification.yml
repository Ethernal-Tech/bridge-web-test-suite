name: Notification

on:
  workflow_call:
    inputs:
      needs_json:
        type: string
        required: true
      bridge_name:
        type: string
        required: true

jobs:
  notify:
    name: Notify Slack
    if: (!cancelled())
    runs-on: ubuntu-latest
    steps:
      - name: Collect transactions
        id: collect
        env:
          NEEDS_JSON: ${{ inputs.needs_json }}
        run: |
          transaction=$(echo "$NEEDS_JSON" | jq -c '.bridging.outputs.bridging_status | fromjson')
          all_success=$(echo "$transaction" | jq -r 'if .status == "success" then "true" else "false" end')
          echo "transaction=$transaction" >> "$GITHUB_OUTPUT"
          echo "all_success=$all_success" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: short_sha
        run: echo "value=`echo ${{ github.sha }} | cut -c1-7`" >> $GITHUB_OUTPUT

      - name: Build Slack payload
        env:
          TRANSACTION: ${{ steps.collect.outputs.transaction }}
          BRIDGE: ${{ inputs.bridge_name }}
          ALL_SUCCESS: ${{ steps.collect.outputs.all_success }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          SHORT_SHA: ${{ steps.short_sha.outputs.value }}
        run: |
          jq -n \
            --arg bridge "$BRIDGE" \
            --argjson all_success "$ALL_SUCCESS" \
            --argjson tx "$TRANSACTION" \
            --arg run_url "$RUN_URL" \
            --arg commit_url "$COMMIT_URL" \
            --arg short_sha "$SHORT_SHA" \
            '
            {
              blocks: ([
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: ($bridge + " Bridge | Source " + $tx.source_chain)
                  }
                },
                {
                  type: "actions",
                  elements: (
                    [
                      {
                        type: "button",
                        text: {type: "plain_text", text: "Workflow Run"},
                        style: (if $all_success then "primary" else "danger" end),
                        url: $run_url
                      }
                    ] + [
                      {
                        type: "button",
                        text: {type: "plain_text", text: ($tx.source_label + " " + $tx.destination_label + " Logs")},
                        url: ($run_url + "/artifacts/" + ($tx.logs_artifact_id | tostring))
                      }
                    ]
                  )
                },
                {
                  type: "context",
                  elements: [{type: "mrkdwn", text: ("Commit: *<" + $commit_url + "|" + $short_sha + ">*")}]
                },
                {type: "divider"},
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: (
                      (if $tx.source then ":green:" else ":red:" end) + " *" + $tx.source_label + "* " +
                      (if $tx.bridge then ":green:" else ":red:" end) + " *Bridge* " +
                      (if $tx.destination then ":green:" else ":red:" end) + " *" + $tx.destination_label + "*"
                    )
                  }
                }
              ])
            }' > payload.json

      - name: Notify Slack
        uses: slackapi/slack-github-action@v3
        with:
          payload-file-path: payload.json
          payload-templated: true
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
