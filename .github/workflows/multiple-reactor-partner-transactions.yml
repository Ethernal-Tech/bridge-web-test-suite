---
name: Multiple Reactor Transactions

on:
  schedule:
    - cron: "30 4,9 * * *" # currently run at ~8:30 and ~13:30
      timezone: "Europe/Belgrade"

  workflow_dispatch:
    inputs:
      notification:
        type: boolean
        required: false
        description: "Notification"
        default: true

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  source_prime:
    name: Source Prime
    uses: ./.github/workflows/source-prime.yml
    with:
      bridge_name: Reactor
      notification: ${{ github.event_name == 'schedule' || inputs.notification != false }}
    secrets: inherit

  source_vector:
    name: Source Vector
    uses: ./.github/workflows/source-vector.yml
    with:
      bridge_name: Reactor
      notification: ${{ github.event_name == 'schedule' || inputs.notification != false }}
    secrets: inherit

  source_nexus:
    name: Source Nexus
    uses: ./.github/workflows/source-nexus.yml
    with:
      bridge_name: Reactor
      notification: ${{ github.event_name == 'schedule' || inputs.notification != false }}
    secrets: inherit
