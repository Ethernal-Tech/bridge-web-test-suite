---
name: Source Sei Transactions

on:
  workflow_call:
    inputs:
      bridge_name:
        type: string
        required: true

    outputs:
      transactions:
        value: ${{ jobs.collect.outputs.transactions }}

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  sei_sei_to_preview_csei:
    name: Sei(SEI) to Preview(cSEI)
    uses: ./.github/workflows/single-transaction.yml
    if: ${{ inputs.bridge_name == 'Skyline' }}
    with:
      bridge_name: ${{ inputs.bridge_name }}
      source_chain: Sei
      amount: 0.0005
      source_token: SEI
      destination_chain: Preview
      destination_token: cSEI
      notification: false
    secrets: inherit

  collect:
    name: Collect
    uses: ./.github/workflows/collect-transactions.yml
    if: (!cancelled())
    needs:
      - sei_sei_to_preview_csei
    with:
      needs_json: ${{ toJSON(needs) }}
      source_chain: Sei
