---
name: Single Transaction

on:
  workflow_dispatch:
    inputs:
      bridge_name:
        type: string
        required: true
        description: "Bridge"
      source_chain:
        type: string
        required: true
        description: "Source chain"
      source_token:
        type: string
        required: true
        description: "Source token"
      destination_chain:
        type: string
        required: true
        description: "Destination chain"
      destination_token:
        type: string
        required: true
        description: "Destination token"
      amount:
        type: string
        required: true
        description: "Amount to send from Source to Destination"
      notification:
        type: boolean
        required: false
        description: "Notification"

  workflow_call:
    inputs:
      bridge_name:
        type: string
        required: true
      source_chain:
        type: string
        required: true
      source_token:
        type: string
        required: true
      destination_chain:
        type: string
        required: true
      destination_token:
        type: string
        required: true
      amount:
        type: string
        required: true
      notification:
        type: boolean
        required: true

    outputs:
      bridging_status:
        value: ${{ jobs.bridging.outputs.bridging_status }}

    secrets:
      SIGN_KEY:
        required: true
      CHROME_URL:
        required: true
      CHROME_CONFIGS_URL:
        required: true

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  bridging:
    name: "${{ inputs.source_chain }} ${{ inputs.source_token }} to ${{ inputs.destination_chain }} ${{ inputs.destination_token }}"
    runs-on: macos-26
    outputs:
      bridging_status: ${{ steps.bridging_status.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Python 3.9
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.9"
          check-latest: true
          cache: "pip"

      - name: Change Google Chrome For Testing version
        run: |
          sudo rm -rf /Applications/Google\ Chrome\ for\ Testing.app
          wget -q -O chrome.zip "${{ secrets.CHROME_URL }}"
          unzip -q chrome.zip
          sudo mv chrome-mac-arm64/Google\ Chrome\ for\ Testing.app /Applications

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      - name: Increase screen resolution
        run: |
          brew install displayplacer
          DISPLAYPLACER_LIST=$(displayplacer list)
          SCREEN_ID=$(echo "$DISPLAYPLACER_LIST" | grep "Persistent screen id:" | head -1 | awk '{print $NF}')
          SCREEN_OPTION_MODES=$(echo "$DISPLAYPLACER_LIST" | grep -E '1920x1080' | sed -E 's/^[[:space:]]*mode [0-9]+:[[:space:]]*//')
          SCREEN_OPTION=$(echo "$SCREEN_OPTION_MODES" | grep 'scaling:on' | head -1)
          if [ -z "$SCREEN_OPTION" ]; then
            SCREEN_OPTION=$(echo "$SCREEN_OPTION_MODES" | head -1)
          fi
          displayplacer "id:${SCREEN_ID} ${SCREEN_OPTION}"

        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      - name: Set bridge URL
        id: bridge_url
        run: |
          if [[ "${{ inputs.bridge_name }}" == "Skyline" ]]; then
            echo "value=${{ vars.SKYLINE_URL }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ vars.REACTOR_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Start bridging
        run: python main.py ${{ inputs.bridge_name }} ${{ inputs.source_chain }} ${{ inputs.amount }} ${{ inputs.source_token }} ${{ inputs.destination_chain }}
        env:
          PYTHONUNBUFFERED: 1
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          BRIDGE_URL: ${{ steps.bridge_url.outputs.value }}
          CHROMEDRIVER_VERSION: ${{ vars.CHROMEDRIVER_VERSION }}
          CHROME_CONFIGS_URL: ${{ secrets.CHROME_CONFIGS_URL }}

      - name: Archive logs
        id: logs-artifact-upload
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ${{ inputs.source_chain }}_${{ inputs.source_token }}_to_${{ inputs.destination_chain }}_${{ inputs.destination_token }}_logs
          path: |
            - logs/*
            - statuses.json
          retention-days: 3

      - name: Generate statuses of the bridging process
        id: bridging_status
        if: (!cancelled())
        run: |
          if [[ ! -f statuses.json ]]; then
            echo '{"status":"failed","source":false,"bridge":false,"destination":false}' > statuses.json
          fi
          json=$(jq -c \
            --arg logs_artifact_id "${{ steps.logs-artifact-upload.outputs.artifact-id }}" \
            --arg source_chain "${{ inputs.source_chain }}" \
            --arg source_label "${{ inputs.source_chain }} (${{ inputs.source_token }})" \
            --arg destination_label "${{ inputs.destination_chain }} (${{ inputs.destination_token }})" \
            '. + {logs_artifact_id: $logs_artifact_id, source_chain: $source_chain, source_label: $source_label, destination_label: $destination_label}' \
            statuses.json)
          echo "result=$json" >> $GITHUB_OUTPUT

  notification:
    name: Notification
    uses: ./.github/workflows/notification.yml
    if: (!cancelled() && inputs.notification)
    needs: bridging
    with:
      needs_json: ${{ toJSON(needs) }}
      bridge_name: ${{ inputs.bridge_name }}
    secrets: inherit
